<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobile Viewport Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Prevents iOS Safari from auto-styling & recoloring phone numbers -->
    <meta name="format-detection" content="telephone=no">
    
    <!-- ==================== PAGE TITLE & SEO ==================== -->
    <title>Trinitas Aeterna Trading LLC | Curated Horology</title>
    <meta property="og:title" content="Trinitas Aeterna Trading LLC | Curated Horology">
    <meta property="og:description" content="Curated Horology & Fine Timepieces by Christian Alexander.">
    <meta property="og:url" content="https://TrinitasCollection.com">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%; /* Prevents text inflation on orientation change on iOS */
            text-size-adjust: 100%;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic Viewport Height for mobile browser address bar adjustment */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Dark emerald gradient website background */
            background: #050d0a;
            background: radial-gradient(circle at center, #112a22 0%, #050d0a 100%);
            background-attachment: fixed;
            color: #f4f4f4;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            padding: 30px 15px;
        }

        /* Atmospheric Vignette Overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(3,5,4,0) 0%, rgba(2,3,2,0.65) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Luxury Gold Border Frame */
        body::after {
            content: '';
            position: fixed;
            inset: 20px;
            border: 1px solid rgba(217, 184, 106, 0.25);
            pointer-events: none;
            z-index: 3;
        }

        /* ==================== LAYOUT CONTAINER ==================== */
        .page-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 800px;
            width: 100%;
            gap: 28px;
            text-align: center;
            will-change: transform, opacity;
            animation: masterEntrance 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform: translateZ(0); /* Hardware acceleration trigger */
        }

        /* Logo Container */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7));
        }

        .master-logo {
            width: 100%;
            max-width: 340px;
            height: auto;
            display: block;
            border-radius: 6px;
            clip-path: inset(0 0 4% 0);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (hover: hover) and (pointer: fine) {
            .master-logo:hover {
                transform: scale(1.02);
            }
        }

        /* Contact Info Overlay */
        .content-overlay {
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            width: 100%;
            max-width: 500px;
        }

        /* ==================== TYPOGRAPHY ==================== */
        .subtitle {
            font-family: 'Montserrat', Arial, sans-serif;
            color: #e2e2e2;
            font-size: clamp(0.68rem, 2vw, 0.75rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 0 18px 0;
            font-weight: 300;
        }

        .curator-info {
            position: relative;
            padding-top: 20px;
            margin-top: 10px;
        }

        /* Centered Champagne Gold Divider Line */
        .curator-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(227, 200, 122, 0.8), transparent);
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.85rem, 3vw, 1rem);
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0 0 6px 0;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .title-role {
            font-size: clamp(0.6rem, 1.8vw, 0.68rem);
            letter-spacing: 3.5px;
            color: #e3c87a;
            text-transform: uppercase;
            margin: 0 0 16px 0;
            font-weight: 400;
        }

        .contact-details {
            font-size: clamp(0.72rem, 2.2vw, 0.8rem);
            letter-spacing: 2px;
            color: #dcdcdc;
            margin: 4px 0;
            font-weight: 300;
        }

        .contact-details a {
            color: #dcdcdc;
            text-decoration: none;
            display: inline-block;
            padding: 6px 10px; /* Expands touch target on mobile */
            transition: color 0.3s ease, letter-spacing 0.3s ease;
        }

        .contact-details a:hover,
        .contact-details a:focus {
            color: #f3df9b;
            letter-spacing: 2.8px;
        }

        /* Mobile & Tablet Adjustments */
        @media (max-width: 768px) {
            body::after {
                inset: 12px; /* Narrower border on mobile screens */
            }
            .master-logo {
                max-width: 270px;
            }
            .page-container {
                gap: 20px;
            }
        }

        /* Small Screen Height Adjustments (Mobile Landscape) */
        @media (max-height: 600px) {
            body {
                align-items: flex-start;
                padding-top: 40px;
                padding-bottom: 40px;
            }
            body::after {
                display: none; /* Hide frame border on landscape mobile to prevent cutting through content */
            }
        }

        @keyframes masterEntrance {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- ==================== LOGO FRONT & CENTER ==================== -->
        <div class="logo-wrapper">
            <img src="logo2_2.jpg" alt="Trinitas Aeterna Trading LLC Emblem" class="master-logo">
        </div>

        <!-- ==================== SEAMLESS CONTACT INFO ==================== -->
        <main class="content-overlay">
            
            <p class="subtitle">Curated Horology & Fine Timepieces</p>
            
            <address class="curator-info" style="font-style: normal;">
                
                <p class="name">CHRISTIAN ALEXANDER</p>
                
                <p class="title-role">Founder & Curator</p>
                
                <p class="contact-details">✉ <a href="mailto:Christian@TrinitasCollection.com">Christian@TrinitasCollection.com</a></p>
                
                <p class="contact-details">☎ <a href="tel:3106003351">310.600.3351</a></p>
                
                <p class="contact-details">🌐 <a href="https://TrinitasCollection.com" target="_blank" rel="noopener noreferrer">TrinitasCollection.com</a></p>
                
            </address>
        </main>

    </div>

</body>
</html>
