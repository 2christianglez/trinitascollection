<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trinitas Collection | Curated Horology</title>
    
    <!-- Open Graph Social Sharing Meta Tags -->
    <meta property="og:title" content="Trinitas Collection | Curated Horology">
    <meta property="og:description" content="Curated Horology & Fine Timepieces by Christian Alexander.">
    <meta property="og:url" content="https://TrinitasCollection.com">
    <meta property="og:type" content="website">

    <!-- High-Performance Font Preconnecting -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #020302 url('Web.Site.2.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #f4f4f4;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            box-sizing: border-box;
            padding-bottom: 75px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Haute Horlogerie Atmospheric Vignette Layer */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(3,5,4,0.15) 0%, rgba(2,3,2,0.88) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Luxury Viewport Architectural Frame */
        body::after {
            content: '';
            position: absolute;
            inset: 24px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            pointer-events: none;
            z-index: 3;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            background: linear-gradient(145deg, rgba(10, 15, 12, 0.85) 0%, rgba(2, 4, 3, 0.94) 100%);
            padding: 52px 68px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(229, 197, 101, 0.55);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            border-left: 1px solid rgba(212, 175, 55, 0.12);
            border-right: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: masterEntrance 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 88%;
            width: 460px;
            box-sizing: border-box;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.7s ease;
        }

        .content-overlay:hover {
            transform: translateY(-4px);
            box-shadow: 0 60px 120px rgba(0, 0, 0, 0.98), 0 0 45px rgba(212, 175, 55, 0.08);
        }

        h1 {
            font-family: 'Cinzel', serif;
            letter-spacing: 9px;
            font-size: 1.7rem;
            text-transform: uppercase;
            font-weight: 400;
            background: linear-gradient(180deg, #fff6cc 0%, #e5c565 52%, #8c7120 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px 0;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
            animation: letterSpacingReveal 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .subtitle {
            font-family: 'Montserrat', Arial, sans-serif;
            color: #d1d1d1;
            font-size: 0.7rem;
            letter-spacing: 4.5px;
            text-transform: uppercase;
            margin: 0 0 32px 0;
            font-weight: 200;
            opacity: 0.9;
        }

        .curator-info {
            position: relative;
            padding-top: 22px;
            margin-top: 22px;
        }

        /* Precision Hairline Divider with Gilded Center */
        .curator-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.7), transparent);
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0 0 6px 0;
            font-weight: 400;
        }

        .title-role {
            font-size: 0.65rem;
            letter-spacing: 3.5px;
            color: #d4af37;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            font-weight: 300;
        }

        .contact-details {
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            color: #b0b0b0;
            margin: 10px 0;
            font-weight: 200;
        }

        .contact-details a {
            color: #b0b0b0;
            text-decoration: none;
            transition: color 0.4s ease, letter-spacing 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-details a:hover {
            color: #e5c565;
            letter-spacing: 3.2px;
        }

        @keyframes masterEntrance {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes letterSpacingReveal {
            from {
                letter-spacing: 14px;
                opacity: 0;
            }
            to {
                letter-spacing: 9px;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <main class="content-overlay">
        <h1>Trinitas Collection</h1>
        <p class="subtitle">Curated Horology & Fine Timepieces</p>
        
        <address class="curator-info" style="font-style: normal;">
            <p class="name">CHRISTIAN ALEXANDER</p>
            <p class="title-role">Founder & Curator</p>
            <p class="contact-details">✉ <a href="mailto:Christian@TrinitasCollection.com">Christian@TrinitasCollection.com</a></p>
            <p class="contact-details">☎ <a href="tel:3106003351">310.600.3351</a></p>
            <p class="contact-details">🌐 <a href="https://TrinitasCollection.com" target="_blank">TrinitasCollection.com</a></p>
        </address>
    </main>
</body>
</html>
