<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trinitas Collection | Curated Horology &amp; Fine Timepieces</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #081c15;
      background-image: radial-gradient(circle at center, #0f2e23 0%, #05130e 100%);
      color: #f5f5f5;
      font-family: 'Cinzel', 'Times New Roman', Georgia, serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(8, 28, 21, 0.6);
      border: 1px solid rgba(197, 160, 89, 0.25);
      border-radius: 4px;
      padding: 40px 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      max-width: 240px;
      width: 100%;
      height: auto;
      margin-bottom: 24px;
      display: block;
      margin-left: auto;
      margin-right: auto;
      border-radius: 4px;
    }
    .badge {
      display: inline-block;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: #c5a059;
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .tagline {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.95rem;
      color: #e0e0e0;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .divider {
      border: 0;
      border-top: 1px solid rgba(197, 160, 89, 0.3);
      width: 60px;
      margin: 0 auto 28px auto;
    }
    .founder-name {
      letter-spacing: 0.15em;
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .founder-title {
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      color: #c5a059;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .contact-item {
      margin-bottom: 8px;
    }
    .contact-item a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }
    .contact-item a:hover {
      color: #c5a059;
    }
    .domain-link {
      margin-top: 16px;
      margin-bottom: 24px;
    }
    .domain-link a {
      color: #c5a059;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }
    .footer-note {
      font-size: 0.72rem;
      color: #c5a059;
      letter-spacing: 0.06em;
      margin-top: 16px;
      border-top: 1px dashed rgba(197, 160, 89, 0.25);
      padding-top: 16px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Emblem / Logo -->
    <!-- REPLACE 'PASTE_YOUR_BASE64_STRING_HERE' WITH YOUR STRING FROM BASE64-IMAGE.DE -->
    <img src="PASTE_YOUR_BASE64_STRING_HERE" alt="Trinitas Aeterna Trading LLC" class="logo">

    <!-- Coming Soon Status Badge -->
    <div>
      <span class="badge">Direct Digital Storefront — Launching Soon</span>
    </div>

    <!-- Main Tagline -->
    <h1 class="tagline">Curated Horology &amp; Fine Timepieces</h1>

    <hr class="divider">

    <!-- Founder Information -->
    <h2 class="founder-name">CHRISTIAN ALEXANDER</h2>
    <p class="founder-title">Founder &amp; Curator</p>

    <!-- Contact Information -->
    <div class="contact-item">
      <a href="mailto:Christian@TrinitasCollection.com">Christian@TrinitasCollection.com</a>
    </div>
    <div class="contact-item">
      <a href="tel:3106003351">310.600.3351</a>
    </div>
    <div class="domain-link">
      <a href="https://TrinitasCollection.com">TrinitasCollection.com</a>
    </div>

    <!-- Legal Entity & Channel Footprint (Gold Accent) -->
    <div class="footer-note">
      &copy; 2026 Trinitas Aeterna Trading LLC &bull; Direct Online Platform &amp; Marketplace Integration
    </div>
  </div>

</body>
</html>
