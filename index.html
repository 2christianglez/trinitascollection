<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ==================== PAGE TITLE & SEO ==================== -->
    <title>Trinitas Aeterna Trading LLC | Curated Horology</title>
    <meta property="og:title" content="Trinitas Aeterna Trading LLC | Curated Horology">
    <meta property="og:description" content="Curated Horology & Fine Timepieces by Christian Alexander.">
    <meta property="og:url" content="https://TrinitasCollection.com">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
        /* ==================== GLOBAL STYLES ==================== */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* EDIT BACKGROUND IMAGE HERE if needed */
            background: #020302 url('Web.Site.2.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #f4f4f4;
            font-family: 'Montserrat', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        /* Atmospheric Vignette Overlay */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(3,5,4,0.1) 0%, rgba(2,3,2,0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Luxury Gold Border Frame */
        body::after {
            content: '';
            position: absolute;
            inset: 24px;
            border: 1px solid rgba(217, 184, 106, 0.2);
            pointer-events: none;
            z-index: 3;
        }

        /* ==================== LAYOUT CONTAINER ==================== */
        .page-container {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            width: 90%;
            box-sizing: border-box;
            gap: 50px;
        }

        /* Left Side: Logo Column */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-width: 0;
            animation: masterEntrance 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .master-logo {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.75));
            border-radius: 4px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .master-logo:hover {
            transform: scale(1.02);
        }

        /* Right Side: Contact Card Column */
        .card-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .content-overlay {
            /* Rich Emerald Green Luxury Card Background */
            background: linear-gradient(145deg, rgba(31, 90, 74, 0.78) 0%, rgba(20, 58, 48, 0.88) 100%);
            padding: 45px 50px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(227, 200, 122, 0.5);
            border-bottom: 1px solid rgba(217, 184, 106, 0.3);
            border-left: 1px solid rgba(217, 184, 106, 0.2);
            border-right: 1px solid rgba(217, 184, 106, 0.2);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: masterEntrance 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            width: 380px;
            box-sizing: border-box;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.7s ease;
        }

        .content-overlay:hover {
            transform: translateY(-4px);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.75), 0 0 35px rgba(217, 184, 106, 0.12);
        }

        /* ==================== CARD TYPOGRAPHY ==================== */
        .subtitle {
            font-family: 'Montserrat', Arial, sans-serif;
            color: #e2e2e2;
            font-size: 0.68rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin: 0 0 24px 0;
            font-weight: 300;
        }

        .curator-info {
            position: relative;
            padding-top: 20px;
            margin-top: 20px;
        }

        /* Champagne Gold Divider Line */
        .curator-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, rgba(227, 200, 122, 0.8), transparent);
        }

        .name {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 3.5px;
            color: #ffffff;
            margin: 0 0 5px 0;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .title-role {
            font-size: 0.63rem;
            letter-spacing: 3px;
            color: #e3c87a;
            text-transform: uppercase;
            margin: 0 0 22px 0;
            font-weight: 400;
        }

        .contact-details {
            font-size: 0.72rem;
            letter-spacing: 2.2px;
            color: #dcdcdc;
            margin: 12px 0;
            font-weight: 300;
        }

        .contact-details a {
            color: #dcdcdc;
            text-decoration: none;
            transition: color 0.4s ease, letter-spacing 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .contact-details a:hover {
            color: #f3df9b;
            letter-spacing: 2.8px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            html, body {
                overflow: auto;
            }
            body {
                padding: 40px 0;
                align-items: flex-start;
            }
            .page-container {
                flex-direction: column;
                gap: 30px;
            }
            .content-overlay {
                width: 90%;
                max-width: 400px;
            }
        }

        @keyframes masterEntrance {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- ==================== EDIT LOGO IMAGE HERE ==================== -->
        <div class="logo-wrapper">
            <!-- logo.PNG matches your current repository file -->
            <img src="logo.PNG" alt="Trinitas Aeterna Trading LLC Emblem" class="master-logo">
        </div>

        <!-- ==================== EDIT CONTACT CARD DETAILS HERE ==================== -->
        <div class="card-wrapper">
            <main class="content-overlay">
                
                <!-- Card Subtitle -->
                <p class="subtitle">Curated Horology & Fine Timepieces</p>
                
                <address class="curator-info" style="font-style: normal;">
                    
                    <!-- Your Name -->
                    <p class="name">CHRISTIAN ALEXANDER</p>
                    
                    <!-- Your Title -->
                    <p class="title-role">Founder & Curator</p>
                    
                    <!-- Email Address -->
                    <p class="contact-details">✉ <a href="mailto:Christian@TrinitasCollection.com">Christian@TrinitasCollection.com</a></p>
                    
                    <!-- Phone Number -->
                    <p class="contact-details">☎ <a href="tel:3106003351">310.600.3351</a></p>
                    
                    <!-- Website Link -->
                    <p class="contact-details">🌐 <a href="https://TrinitasCollection.com" target="_blank">TrinitasCollection.com</a></p>
                    
                </address>
            </main>
        </div>

    </div>

</body>
</html>
