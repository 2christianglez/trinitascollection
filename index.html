  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-dark: #072419;
      --bg-mid: #0f3d2b;
      --bg-card: rgba(16, 60, 43, 0.88);
      --gold: #d4af5a;
      --gold-light: #f2dc94;
      --gold-deep: #9c7a2e;
      --text: #f6f0dd;
      --line: rgba(212, 175, 90, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-color: var(--bg-dark);
      background-image: radial-gradient(ellipse at top, var(--bg-mid) 0%, var(--bg-dark) 75%);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px 32px 32px;
      text-align: center;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Logo: embedded directly in this file, so it can never fail to load */
    .logo-frame {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 32px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
    }

    .logo-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Gold text: plain gold by default, metallic gradient where supported */
    .gold-text { color: var(--gold); }

    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .gold-text {
        background-image: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-deep) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
    }

    .badge {
      display: inline-block;
      padding: 8px 20px;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .divider {
      width: 80px;
      height: 2px;
      margin: 28px auto;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title {
      margin-top: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .contact { margin-top: 28px; font-size: 1.15rem; }
    .contact p { margin-bottom: 12px; }

    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    a:hover, a:focus-visible { color: var(--gold-light); border-bottom-color: var(--gold); }
    a.site { color: var(--gold); letter-spacing: 0.06em; }

    footer {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px dashed var(--line);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--gold);
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; }
      .logo-frame { max-width: 230px; }
      h1, h2 { font-size: 1.1rem; }
      .badge { font-size: 0.7rem; letter-spacing: 0.15em; }
      .contact { font-size: 1rem; }
    }
  </style>
</head>
